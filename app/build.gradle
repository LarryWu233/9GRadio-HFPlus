plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 35
    namespace "com.radiosport.ninegradio"
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.radiosport.ninegradio.hfplus"
        minSdk 26
        targetSdk 35
        versionCode 29
        versionName "0.28.0-hfplus-alpha28"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters.addAll((project.findProperty("targetAbi") ?: "arm64-v8a,armeabi-v7a,x86_64").split(",").toList())
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    if (rootProject.file("build/toolchains/ndk/android-ndk-r28c").exists()) {
        ndkPath rootProject.file("build/toolchains/ndk/android-ndk-r28c").absolutePath
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true   // exposes BuildConfig.VERSION_NAME / VERSION_CODE at runtime
    }
    sourceSets {
        test.java.srcDir 'src/sharedTest/java'
        androidTest.java.srcDir 'src/sharedTest/java'
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

android.applicationVariants.all { variant ->
    android.sourceSets.getByName(variant.buildType.name).jniLibs.srcDir("$buildDir/generated/readsb/${variant.buildType.name}")
    tasks.matching { it.name == "merge${variant.name.capitalize()}JniLibFolders" }.configureEach {
        dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    variant.outputs.all {
        outputFileName = "9GRadioHFPlus_${variant.versionName}_${variant.buildType.name}.apk"
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.7.1'
    implementation 'androidx.media3:media3-session:1.7.1'
    implementation project(':blurview')
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    kapt 'androidx.room:room-compiler:2.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
